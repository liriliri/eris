name: Publish to NPM

run-name: Publish ${{ github.event.inputs.module }} to NPM

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: |
          npm i -g npm@11.19.0
          npm i
          node bin/eris.js build ${{ github.event.inputs.module }}
          cd dist/${{ github.event.inputs.module }}
          npm publish
